name: Infracost

on:
  pull_request:
    paths:
      - 'terraform/**'
      - '.github/workflows/infracost.yml'
  push:
    paths:
      - 'terraform/**'
      - '.github/workflows/infracost.yml'

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  terraform-plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::071853465066:role/Github_aws_account
          aws-region: us-east-1

      - name: Configure GCP Credentials via OIDC
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/376082230878/locations/global/workloadIdentityPools/github-work-flow/providers/github-work-flow'
          service_account: 'my-app-sa@project-2a6cdcd2-cf93-47c3-959.iam.gserviceaccount.com'

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: terraform plan -out=tfplan.binary -no-color

      - name: Convert plan to JSON
        run: terraform show -json tfplan.binary > tfplan.json

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: terraform/tfplan.json
          if-no-files-found: error

  infracost:
    needs: terraform-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Terraform plan
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan
          path: terraform

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate Infracost breakdown
        run: |
          infracost breakdown \
            --path=. \
            --format=json \
            --terraform-plan-file=tfplan.json \
            --out-file=infracost.json

      - name: Post Infracost comment
        if: github.event_name == 'pull_request'
        run: |
          infracost comment github \
            --repo ${{ github.repository }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --path=infracost.json \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --behavior=update

  approval:
    needs: [terraform-plan, infracost]
    runs-on: ubuntu-latest
    environment:
      name: approval
    steps:
      - name: Await human approval
        run: echo "Waiting for approval before proceeding with deployment actions."
